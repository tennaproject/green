name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: green-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Upload exact Worker artifact
        uses: actions/upload-artifact@v7
        with:
          name: green-worker-${{ github.sha }}
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Download exact Worker artifact
        uses: actions/download-artifact@v8
        with:
          name: green-worker-${{ github.sha }}
          path: dist
      - name: Deploy artifact to green Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --message="GitHub ${{ github.sha }}"
